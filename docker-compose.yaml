x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # redis
  redis:
    image: redis:7
    container_name: erp-redis-local
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  # telegram_bot
  bot:
    build: .
    container_name: erp-bot-local
    env_file:
      - .env.docker
    command:
      - python
      - -m
      - app.interfaces.bot.main
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # celery worker
  worker:
    build: .
    container_name: erp-worker-local
    env_file:
      - .env.docker
    command:
      - python
      - -m
      - celery
      - -A
      - app.core.tasks.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # celery beat
  beat:
    build: .
    container_name: erp-beat-local
    env_file:
      - .env.docker
    command:
      - python
      - -m
      - celery
      - -A
      - app.core.tasks.celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging